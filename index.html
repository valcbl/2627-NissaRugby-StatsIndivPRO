];
function renderCompare(){
  if(!cmpUnlocked()){ renderLock(); window.__report={id:COMPARE_ID,season:true,ajoute:'lock'}; return; }
  const el=document.getElementById('report');
  const list=[...MATCHES].sort((a,b)=>jnum(a)-jnum(b));
  if(!list.length){ renderReport(null); return; }
  const all=seasonData(list).players.sort((a,b)=>a.name.localeCompare(b.name,'fr'));
  const names=all.map(p=>p.name);
  const byAct=[...all].sort((a,b)=>b.actions-a.actions);
  if(!names.includes(CMP.a)) CMP.a=byAct[0]?.name;
  if(!names.includes(CMP.b)||CMP.b===CMP.a) CMP.b=byAct.find(p=>p.name!==CMP.a)?.name;
  if(CMP.scope!=='saison'&&!list.find(m=>m.id===CMP.scope)) CMP.scope='saison';
  if(!CMP.mode) CMP.mode='avg';
  const season=CMP.scope==='saison';
  const pool=season?all:mapPlayers(list.find(m=>m.id===CMP.scope).data.players).map(p=>({...p,mj:1}));
  const A=pool.find(p=>p.name===CMP.a), B=pool.find(p=>p.name===CMP.b);
  const avg=season&&CMP.mode==='avg';
  const val=(p,f,unit)=>{ if(!p) return null; const x=f(p); if(x==null) return null; return unit==='%'||!avg?x:Math.round(x/p.mj*10)/10; };
  const fmt=(x,unit)=>x==null?'–':(unit==='%'?x+' %':String(x).replace('.',','));
  let winA=0,winB=0;
  const groups=CMP_STATS.map(([g,stats])=>{
    const rows=stats.map(([lab,f,unit,low])=>{
      const a=val(A,f,unit), b=val(B,f,unit);
      if(!a&&!b) return '';
      const max=Math.max(a||0,b||0)||1;
      let w=0; if(a!=null&&b!=null&&a!==b){ w=(low?a<b:a>b)?1:2; } else if(a!=null&&b==null) w=1; else if(b!=null&&a==null) w=2;
      if(w===1) winA++; if(w===2) winB++;
      return `<div class="cmp-row"><span class="va ${w===1?'win':''}">${fmt(a,unit)}</span><span class="ba"><i style="width:${100*(a||0)/max}%"></i></span><span class="lab">${lab}${low?' <em>(moins = mieux)</em>':''}</span><span class="bb"><i style="width:${100*(b||0)/max}%"></i></span><span class="vb ${w===2?'win':''}">${fmt(b,unit)}</span></div>`;
    }).join('');
    return rows?`<div class="cmp-group"><h4>${g}</h4>${rows}</div>`:'';
  }).join('');
  const opt=(sel)=>names.map(n=>`<option value="${h(n)}"${n===sel?' selected':''}>${h(n)}${posteOf(n)?' ('+posteOf(n)+')':''}</option>`).join('');
  const scopeOpts=`<option value="saison"${season?' selected':''}>Saison (${list.length} matchs)</option>`+[...list].reverse().map(m=>`<option value="${h(m.id)}"${m.id===CMP.scope?' selected':''}>${h(label(m))}</option>`).join('');
  const who=(p,n)=>p?`${h(n)} <small>${season?`${p.mj} match${p.mj>1?'s':''} · `:''}${p.actions} actions</small>`:`${h(n)} <small>n’a pas d’action codée sur ce périmètre</small>`;
  const scopeTxt=season?`Saison 2026-2027 · ${avg?'moyennes par match':'totaux'}`:label(list.find(m=>m.id===CMP.scope));
  el.innerHTML=`<header class="mast"><img src="data:image/png;base64,${LOGO}" alt="Nissa Rugby"><div class="t"><div class="eyebrow">Nissa Rugby · Staff Pro · Comparaison de joueurs</div><h1>${h(CMP.a)} <span>vs</span> ${h(CMP.b)}</h1><div class="meta">${h(scopeTxt)}</div></div></header>
  <div class="card cmp-ctl no-print">
    <label for="cmpA">Joueur A<select id="cmpA">${opt(CMP.a)}</select></label>
    <label for="cmpB">Joueur B<select id="cmpB">${opt(CMP.b)}</select></label>
    <label for="cmpScope">Périmètre<select id="cmpScope">${scopeOpts}</select></label>
    <label for="cmpMode">Affichage<select id="cmpMode"${season?'':' disabled'}><option value="avg"${CMP.mode==='avg'?' selected':''}>Moyenne par match</option><option value="tot"${CMP.mode==='tot'?' selected':''}>Total</option></select></label>
  </div>
  <div class="card cmp">
    <div class="cmp-head"><div class="pa">${who(A,CMP.a)}</div><div class="score"><b>${winA}</b><span>stats en tête</span><b>${winB}</b></div><div class="pb">${who(B,CMP.b)}</div></div>
    ${groups||'<p class="sub">Aucune action codée pour ces deux joueurs sur ce périmètre.</p>'}
    <p class="sub" style="margin-top:12px">Les pourcentages ne sont pas moyennés : ils portent sur toutes les actions du périmètre. Chaque ligne a sa propre échelle ; la valeur en gras est la meilleure des deux.</p>
  </div>`;
  const save=()=>{try{localStorage.setItem('cmp',JSON.stringify(CMP));}catch(e){} renderCompare();};
  $('cmpA').addEventListener('change',e=>{CMP.a=e.target.value; if(CMP.b===CMP.a) CMP.b=byAct.find(p=>p.name!==CMP.a)?.name; save();});
  $('cmpB').addEventListener('change',e=>{CMP.b=e.target.value; save();});
  $('cmpScope').addEventListener('change',e=>{CMP.scope=e.target.value; save();});
  $('cmpMode').addEventListener('change',e=>{CMP.mode=e.target.value; save();});
  window.__report={id:COMPARE_ID,season:true,ajoute:list.map(m=>m.ajoute).join('|')};
}

/* ===== Fiche joueur (staff) ===== */
const FICHE_ID='__fiche';
let FICHE=(()=>{try{return JSON.parse(localStorage.getItem('fiche'))||{};}catch(e){return {};}})();
const FSTATS=[
  ['Tâches','taches',p=>v(p,'taches'),1],['Plaquages réussis','plaq_ok',p=>v(p,'plaq_ok'),1],['Plaquages manqués','plaq_rate',p=>v(p,'plaq_rate'),0],
  ['Plaquages dominants','plaq_dom',p=>v(p,'plaq_dom'),1],['Assistances','ast',p=>v(p,'ast_pos'),1],['Duels au contact gagnés','duel',p=>v(p,'duel_pos'),1],
  ['Mètres gagnés','m',p=>v(p,'m_tot'),1],['Défenseurs battus','db',p=>v(p,'defbattu'),1],['Passes réussies','passe',p=>v(p,'passe_pos'),1],
  ['Interventions au ruck','ro',p=>v(p,'ro'),1],['Actions au sol réussies (grattage, contre-ruck)','rd',p=>v(p,'rd_pos'),1],['Ballons récupérés','recup',p=>v(p,'recup'),1],
  ['Pertes de balle','pdb',p=>v(p,'pdb'),0],['Fautes','faute',p=>v(p,'faute'),0]];
const FRATES=[
  ['Réussite au plaquage',p=>pct(v(p,'plaq_ok'),v(p,'plaq_ok')+v(p,'plaq_rate')),p=>v(p,'plaq_ok')+v(p,'plaq_rate'),90,80],
  ['Duels au contact gagnés',p=>pct(v(p,'duel_pos'),v(p,'duel_pos')+v(p,'duel_neg')),p=>v(p,'duel_pos')+v(p,'duel_neg'),75,65],
  ['Efficacité au ruck',p=>pct(v(p,'ro_pos'),v(p,'ro')),p=>v(p,'ro'),92,85],
  ['Retour rapide après plaquage',p=>pct(v(p,'ret_rapide')+v(p,'ret_debout'),v(p,'ret_rapide')+v(p,'ret_debout')+v(p,'ret_tardif')),p=>v(p,'ret_rapide')+v(p,'ret_debout')+v(p,'ret_tardif'),80,60],
  ['Passes réussies',p=>pct(v(p,'passe_pos'),v(p,'passe_pos')+v(p,'passe_neg')),p=>v(p,'passe_pos')+v(p,'passe_neg'),92,85],
  ['Lancers réussis',p=>pct(v(p,'tl_g'),v(p,'tl_n')),p=>v(p,'tl_n'),85,75],
  ['Ballons gagnés au saut',p=>pct(v(p,'ts_g'),v(p,'ts_n')),p=>v(p,'ts_n'),85,75],
  ['Mêlées gagnées (notre intro)',p=>pct(v(p,'mf_g'),v(p,'mf_n')-v(p,'mf_rj')),p=>v(p,'mf_n')-v(p,'mf_rj'),90,80],
  ['Jeu au pied réussi',p=>pct(v(p,'jap_pos'),v(p,'jap_pos')+v(p,'jap_neg')),p=>v(p,'jap_pos')+v(p,'jap_neg'),80,65],
  ['Jeu aérien gagné',p=>pct(v(p,'aerien_pos'),v(p,'aerien_pos')+v(p,'aerien_neg')),p=>v(p,'aerien_pos')+v(p,'aerien_neg'),65,50]];
const isFwd=p=>['PI','TA','2L','3L'].includes(grpOf(p.name));
const pmin=p=>minTot(p.name)||v(p,'min');
function renderFiche(){
  if(!CMP_OK){ renderLock(FICHE_ID); window.__report={id:FICHE_ID,season:true,ajoute:'lock'}; return; }
  const el=document.getElementById('report');
  const list=[...MATCHES].sort((a,b)=>jnum(a)-jnum(b));
  if(!list.length){ renderReport(null); return; }
  const sd=seasonData(list); P=sd.players; EV=sd.events; ZP=sd.pts; TM=sd.team; SEASON=true;
  const names=P.map(p=>p.name).sort((a,b)=>a.localeCompare(b,'fr'));
  if(!names.includes(FICHE.who)) FICHE.who=[...P].sort((a,b)=>pmin(b)-pmin(a))[0]?.name;
  const me=P.find(p=>p.name===FICHE.who), fwd=isFwd(me), mins=pmin(me)||0, per=x=>mins?x*80/mins:null;
  const myG=grpOf(me.name); let grp=P.filter(p=>p!==me&&grpOf(p.name)===myG&&pmin(p)>=120), refLab=myG?GROUPES[myG].toLowerCase().replace('back 3','back 3').replace(/^/,'joueurs du groupe '):'';
  if(grp.length<1){ grp=P.filter(p=>p!==me&&isFwd(p)===fwd&&pmin(p)>=120); refLab=(fwd?'avants':'arrières')+' (groupe '+(myG?GROUPES[myG]:'?')+' trop petit)'; } else refLab='joueurs du groupe « '+GROUPES[myG]+' »';
  const f1=x=>x==null?'–':(Math.round(x*10)/10).toString().replace('.',',');
  // par 80 minutes
  const rows80=FSTATS.map(([lab,k,f,hi])=>{ const mv=per(f(me)); const vals=grp.map(p=>f(p)*80/pmin(p)); const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
    const better=vals.filter(x=>hi?x>mv:x<mv).length; const rank=mv==null?null:better+1; const pc=vals.length&&mv!=null?(vals.length-better)/(vals.length+1):null;
    return {lab,k,hi,mv,avg,rank,n:vals.length+1,pc,raw:f(me)}; });
  const signif=rows80.filter(r=>r.pc!=null&&(r.raw>0||!r.hi)&&r.k!=='taches');
  const strong=[...signif].filter(r=>r.hi?r.mv>(r.avg||0):r.mv<(r.avg||0)).sort((a,b)=>b.pc-a.pc).slice(0,3);
  const weak=[...signif].filter(r=>r.hi?r.mv<(r.avg||0):r.mv>(r.avg||0)).sort((a,b)=>a.pc-b.pc).slice(0,3);
  const rates=FRATES.map(([lab,f,n,g,w])=>({lab,x:f(me),n:n(me),g,w})).filter(r=>r.n>=3);
  // match par match
  const pm=list.map(m=>{ const p=mapPlayers(m.data.players).find(x=>x.name===me.name); const mn=(MIN[me.name]||{})[colOf(m)]??(Object.entries(m.data.minutes||{}).find(([n])=>canon(n)===me.name)||[])[1]; return {m,p,mn}; });
  const played=pm.filter(x=>x.p||x.mn);
  const k=`<div class="kpis">${kpi('Matchs joués',played.length,`sur ${list.length} matchs importés`,null)}${kpi('Minutes',mins||'–',mins&&played.length?`${Math.round(mins/played.length)} min par match`:'',null)}${kpi('Tâches / 80 min',f1(per(v(me,'taches'))),`${v(me,'taches')} tâches au total`,null)}${kpi('Plaquage',pct(v(me,'plaq_ok'),v(me,'plaq_ok')+v(me,'plaq_rate'))+' %',`${v(me,'plaq_ok')} / ${v(me,'plaq_ok')+v(me,'plaq_rate')} réussis`,status(pct(v(me,'plaq_ok'),v(me,'plaq_ok')+v(me,'plaq_rate')),90,80))}${kpi('Duels au contact',pct(v(me,'duel_pos'),v(me,'duel_pos')+v(me,'duel_neg'))+' %',`${v(me,'duel_pos')} gagnés sur ${v(me,'duel_pos')+v(me,'duel_neg')}`,status(pct(v(me,'duel_pos'),v(me,'duel_pos')+v(me,'duel_neg')),75,65))}${kpi('Mètres / 80 min',f1(per(v(me,'m_tot'))),`${v(me,'m_tot')} m au total`,null)}${kpi('Fautes',v(me,'faute'),[v(me,'cj')?v(me,'cj')+' CJ':'',v(me,'cr')?v(me,'cr')+' CR':''].filter(Boolean).join(' · ')||'aucun carton',v(me,'cr')||v(me,'cj')?['bad','Carton']:null)}${v(me,'pts')?kpi('Points',v(me,'pts'),`${v(me,'essai')} essai${v(me,'essai')>1?'s':''}`,null):''}</div>`;
  const ret=retenir([...strong.map(r=>['good','Point fort',`${r.lab} : ${f1(r.mv)} / 80 min (moyenne ${f1(r.avg)}) · ${r.rank}e sur ${r.n}.`]),...weak.map(r=>['bad','À travailler',`${r.lab} : ${f1(r.mv)} / 80 min (moyenne ${f1(r.avg)}) · ${r.rank}e sur ${r.n}.`])]).replace('<h3>À retenir</h3>','<h3>Points forts et axes de travail</h3>');
  const rateC=rates.length?breakdown('Taux de réussite','Saison, sur toutes ses actions (3 tentatives minimum).',rates.map(r=>({n:r.lab,e:`${r.n} tentatives`,v:r.x||0,t:r.x+' %',c:r.x>=r.g?C.b1:r.x>=r.w?C.b2:C.red}))):'';
  const t80=`<div class="card"><h3>Par 80 minutes</h3><p class="sub">Comparé aux ${refLab} ayant joué au moins 120 minutes (${grp.length} joueur${grp.length>1?'s':''}). Rang : 1 = meilleur${mins<120?' · temps de jeu encore faible, à interpréter avec prudence':''}.</p><div class="tw"><table><thead><tr><th>Stat</th><th>Total</th><th>Joueur / 80</th><th>Moyenne / 80</th><th>Écart</th><th>Rang</th></tr></thead><tbody>${rows80.map(r=>{ const d=r.mv!=null&&r.avg!=null?r.mv-r.avg:null; const good=d==null?'':(r.hi?d>0:d<0)?'g':(r.hi?d<0:d>0)?'r':''; return `<tr><td>${h(r.lab)}${r.hi?'':' <span class="d">(moins = mieux)</span>'}</td><td>${r.raw}</td><td class="pct">${f1(r.mv)}</td><td class="d">${f1(r.avg)}</td><td class="pct ${good}">${d==null?'–':(d>0?'+':'')+f1(d)}</td><td>${r.rank?r.rank+' / '+r.n:'–'}</td></tr>`; }).join('')}</tbody></table></div></div>`;

  <div class="card"><p class="sub">Case vide = pas sur la feuille de match. 0 = entré sans jouer, compte comme une apparition.</p><div class="tw"><table class="mtab ptab"><thead>${head}</thead><tbody>${rows||`<tr><td colspan="${PRO_COLS.length+5}" class="d">Aucun espoir en PRO pour l’instant.</td></tr>`}</tbody></table></div>
  ${edit?`<form id="addPro" class="lockform no-print" style="margin-top:12px"><label for="proSel">Ajouter un espoir au tableau Pro<select id="proSel" required><option value="">Choisir un joueur</option>${avail.map(n=>`<option value="${h(n)}">${h(n)}${posteOf(n)?' ('+posteOf(n)+')':''}</option>`).join('')}</select></label><button type="submit">Ajouter</button><span class="msg" id="proState" aria-live="polite"></span></form>`:''}</div></section>`;
}
function bindPro(el){
  el.querySelectorAll('input[data-pp]').forEach(inp=>inp.addEventListener('change',()=>{ const p=inp.dataset.pp,c=inp.dataset.c; let x=inp.value===''?null:Math.max(0,Math.min(120,Math.round(+inp.value))); PRO.minutes[p]=PRO.minutes[p]||{}; if(x==null) delete PRO.minutes[p][c]; else PRO.minutes[p][c]=x; inp.value=x??''; savePro();
    const tr=inp.closest('tr'), L=PRO_COLS.length; tr.cells[L+1].textContent=proTot(p)||'–'; tr.cells[L+2].textContent=proApp(p)||'–'; tr.cells[L+4].textContent=(proTot(p)+minTot(p))||'–'; }));
  el.querySelectorAll('.rm[data-pro]').forEach(btn=>btn.addEventListener('click',()=>{
    if(!btn.classList.contains('armed')){ btn.classList.add('armed'); btn.textContent='Retirer ?'; setTimeout(()=>{ if(btn.isConnected){ btn.classList.remove('armed'); btn.textContent='×'; } },4000); return; }
    const n=btn.dataset.pro; PRO.joueurs=PRO.joueurs.filter(x=>canon(x)!==n); delete PRO.minutes[n]; savePro(); renderMinutes(); }));
  const f=$('addPro'); if(f) f.addEventListener('submit',e=>{ e.preventDefault(); const n=$('proSel').value; if(!n) return; if(!PRO.joueurs.includes(n)) PRO.joueurs.push(n); savePro(); renderMinutes(); });
}

/* ===== Matchs enregistrés ===== */
let DB=null, MATCHES=[], current=null, pending=null, canWrite=true;
const $=id=>document.getElementById(id);
const slug=s=>norm(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'match';
const label=m=>[m.journee,m.adversaire&&('vs '+m.adversaire),m.date].filter(Boolean).join(' · ')||m.source||m.id;
function fillSelect(){
  const s=$('matchSel');
  const ms=[...MATCHES].sort((a,b)=>jnum(b)-jnum(a));
  s.innerHTML=MATCHES.length?`<option value="${SEASON_ID}">Saison 2026-2027 · cumul</option><option value="${COMPARE_ID}">Comparer deux joueurs</option><option value="${MIN_ID}">Temps de jeu & tâches</option><option value="${FICHE_ID}">Fiche joueur (staff)</option><optgroup label="Matchs">`+ms.map(m=>`<option value="${h(m.id)}">${h(label(m))}</option>`).join('')+'</optgroup>':'<option value="">Aucun match</option>';
  if(current) s.value=current;
  $('btnDelete').hidden=!(DB&&canWrite&&current&&current!==SEASON_ID&&current!==COMPARE_ID&&current!==MIN_ID&&current!==FICHE_ID);
}
function show(id){
  GINF=inferGroups(); current=id; const m=MATCHES.find(x=>x.id===id);
  try{ localStorage.setItem('match',id||''); }catch(e){}
  fillSelect(); if(id===SEASON_ID) renderSeason(); else if(id===COMPARE_ID) renderCompare(); else if(id===MIN_ID) renderMinutes(); else if(id===FICHE_ID) renderFiche(); else renderReport(m||null);
  disarm();
}
function docToMatch(snap){ const d=snap.data(); try{ return {...d,id:snap.id,data:JSON.parse(d.payload)}; }catch(e){ return null; } }

$('matchSel').addEventListener('change',e=>show(e.target.value));
$('btnImport').addEventListener('click',()=>{ $('importPanel').hidden=!$('importPanel').hidden; });
$('btnCancel').addEventListener('click',()=>{ $('importPanel').hidden=true; resetImport(); });
function resetImport(){ pending=null; $('btnSave').disabled=true; $('dropLabel').textContent='Glisse ton fichier CSV ou XML ici'; $('msg').textContent=''; $('msg').className='msg'; $('file').value=''; }
const drop=$('drop');
drop.addEventListener('click',()=>$('file').click());
drop.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click();}});
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over'); if(e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);});
$('file').addEventListener('change',e=>{ if(e.target.files[0]) readFile(e.target.files[0]); });

function decodeBytes(u){
  // UTF-16 (exports Sportscode/Hudl), UTF-8, sinon Windows-1252 (CSV Excel)
  if(u[0]===0xFF&&u[1]===0xFE) return new TextDecoder('utf-16le').decode(u.subarray(2));
  if(u[0]===0xFE&&u[1]===0xFF) return new TextDecoder('utf-16be').decode(u.subarray(2));
  if(u.length>3&&u[0]===0x3C&&u[1]===0x00) return new TextDecoder('utf-16le').decode(u);
  if(u.length>3&&u[0]===0x00&&u[1]===0x3C) return new TextDecoder('utf-16be').decode(u);
  try{ return new TextDecoder('utf-8',{fatal:true}).decode(u); }catch(e){ return new TextDecoder('windows-1252').decode(u); }
}
function readFile(file){
  const msg=$('msg'); msg.className='msg'; msg.textContent='Lecture…';
  const r=new FileReader();
  r.onload=()=>{
    try{
      const text=decodeBytes(new Uint8Array(r.result));
      const isXML=/\.xml$/i.test(file.name)||/^\s*<\?xml|^\s*<file/i.test(text);
      const rows=isXML?parseXML(text):parseCSV(text);
      if(!rows.length) throw new Error('Aucune action trouvée dans le fichier.');
      const data=compute(rows);
      pending={source:file.name,data};
      const j=file.name.match(/J\s*0*(\d{1,2})/i); if(j&&!$('fJournee').value) $('fJournee').value='J'+j[1];
      if(rows.info){ if(rows.info.journee) $('fJournee').value=rows.info.journee; if(rows.info.adversaire&&!$('fAdv').value) $('fAdv').value=rows.info.adversaire; if(rows.info.date&&!$('fDate').value) $('fDate').value=rows.info.date; }
      $('dropLabel').textContent=file.name;
      msg.className='msg ok'; msg.textContent=`${rows.length} séquences lues, ${data.players.length} joueurs. Renseigne l’adversaire puis génère le rapport.`;
      $('btnSave').disabled=false;
    }catch(err){ pending=null; $('btnSave').disabled=true; msg.className='msg err'; msg.textContent=err.message+' Vérifie que c’est bien l’export « indiv » (CSV ou XML).'; }
  };
  r.onerror=()=>{ msg.className='msg err'; msg.textContent='Impossible de lire ce fichier.'; };
  r.readAsArrayBuffer(file);
}
$('btnSave').addEventListener('click',async()=>{
  if(!pending) return;
  const m={journee:$('fJournee').value.trim(),adversaire:$('fAdv').value.trim(),date:$('fDate').value.trim(),source:pending.source,ajoute:new Date().toISOString()};
  const id=slug([m.journee,m.adversaire].filter(Boolean).join(' ')||pending.source.replace(/\.[^.]+$/,''));
  const full={...m,id,data:pending.data};
  if(DB&&canWrite){
    $('btnSave').disabled=true; $('msg').className='msg'; $('msg').textContent='Enregistrement…';
    try{ await DB.collection('matchs').doc(id).set({...m,payload:JSON.stringify(pending.data)}); }
    catch(e){ $('btnSave').disabled=false; $('msg').className='msg err';
      $('msg').textContent=e&&e.code==='quota_exceeded'?'Espace de stockage plein : supprime un ancien match puis réessaie.':e&&e.code==='invalid_argument'?'Tu n’as pas les droits pour enregistrer un match sur cette page. Le rapport s’affiche quand même ci-dessous.':'Enregistrement impossible pour le moment. Réessaie dans un instant.';
      MATCHES=MATCHES.filter(x=>x.id!==id).concat(full); show(id); return; }
  }
  const col=colOf(m), mins=pending.data.minutes;
  if(col&&mins&&DB&&canWrite){ for(const n in mins){ const c=canon(n); MIN[c]=MIN[c]||{}; MIN[c][col]=mins[n]; } saveMinutes(); }
  MATCHES=MATCHES.filter(x=>x.id!==id).concat(full).sort((a,b)=>String(b.ajoute).localeCompare(String(a.ajoute)));
  $('importPanel').hidden=true; resetImport(); ['fJournee','fAdv','fDate'].forEach(i=>$(i).value='');
  show(id);
});
let armed=false;
function disarm(){ armed=false; $('btnDelete').classList.remove('armed'); $('btnDelete').textContent='Supprimer ce match'; }
$('btnDelete').addEventListener('click',async()=>{
  if(!current||!DB) return;
  if(!armed){ armed=true; $('btnDelete').classList.add('armed'); $('btnDelete').textContent='Confirmer la suppression'; setTimeout(disarm,4000); return; }
  const id=current; disarm();
  try{ await DB.collection('matchs').doc(id).delete(); MATCHES=MATCHES.filter(x=>x.id!==id); show(MATCHES[0]?.id||null); }
  catch(e){ $('msg').textContent='Suppression impossible.'; }
});

/* ===== Export PDF de la vue affichée ===== */
let DL=null;
function loadScript(src){return new Promise((res,rej)=>{ if(document.querySelector(`script[src="${src}"]`)) return res(); const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Chargement impossible : '+src)); document.head.appendChild(s); });}
async function libs(){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
}
function exportName(){
  const clean=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'');
  if(current===SEASON_ID) return 'Stats_indiv_Pro_Saison_2026-2027.pdf';
  if(current===FICHE_ID) return `Fiche_${clean(FICHE.who)}_2026-2027.pdf`;
  if(current===COMPARE_ID) return `Comparaison_Pro_${clean(CMP.a)}_vs_${clean(CMP.b)}${CMP.scope==='saison'?'':'_'+clean(label(MATCHES.find(m=>m.id===CMP.scope)||{}))}.pdf`;
  const m=MATCHES.find(x=>x.id===current); return m?`Stats_indiv_Pro_${clean(m.journee||'')}_vs_${clean(m.adversaire||'')}.pdf`:'Stats_indiv_Pro.pdf';
}
function fixSvgColors(root){
  root.querySelectorAll('svg *').forEach(n=>{
    const cs=getComputedStyle(n);
    for(const at of ['fill','stroke']){ const a=n.getAttribute(at); if((a&&a.includes('var('))||(n.tagName==='text'&&at==='fill')) n.setAttribute(at, cs[at]); }
  });
}
async function exportPDF(){
  const btn=$('btnExport'), msg=$('exportMsg');
  const ov=document.createElement('div'); ov.className='export-ov'; ov.innerHTML='<div><b>Préparation du PDF…</b><span>Quelques secondes</span></div>'; document.body.appendChild(ov);
  const root=document.documentElement, prevTheme=root.getAttribute('data-theme'); const sx=window.scrollX, sy0=window.scrollY;
  btn.disabled=true; msg.textContent='';
  try{
    await libs();
    root.setAttribute('data-theme','light'); root.classList.add('exporting');
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    window.scrollTo(0,0);
    const rep=$('report'); fixSvgColors(rep);
    const bg=getComputedStyle(document.body).backgroundColor;
    const mast=rep.querySelector('header.mast'), main=rep.querySelector('main'), foot=rep.querySelector('footer');
    const units=[]; if(mast) units.push({el:mast,kids:[mast]});
    if(main) [...main.children].forEach((sec,si)=>units.push({el:sec,kids:[...sec.children],newPage:si>0}));
    else [...rep.children].filter(c=>c!==mast&&c!==foot&&!c.classList.contains('no-print')&&c.tagName!=='NAV').forEach(c=>units.push({el:c,kids:[c]}));
    if(foot) units.push({el:foot,kids:[foot]});
    const { jsPDF }=window.jspdf; const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});
    const M=10, PW=210-2*M, PH=297-2*M, W=1100, k=PW/W, GAP=12*k, SC=2;
    let bgRGB=[243,243,241]; try{ bgRGB=bg.match(/\d+/g).slice(0,3).map(Number); }catch(e){}
    const paintBg=()=>{ pdf.setFillColor(bgRGB[0],bgRGB[1],bgRGB[2]); pdf.rect(0,0,210,297,'F'); };
    let y=M, first=true; paintBg();
    for(const [ui,u] of units.entries()){
      u.el.setAttribute('data-expu',ui); u.kids.forEach((ch,ci)=>ch.setAttribute('data-expk',ci));
      let geo=[];
      const canvas=await html2canvas(u.el,{scale:SC,backgroundColor:bg,logging:false,windowWidth:W+40,windowHeight:Math.max(2000,document.documentElement.scrollHeight),scrollX:0,scrollY:-window.scrollY,
        onclone:doc=>{ const ue=doc.querySelector(`[data-expu="${ui}"]`); const t0=ue.getBoundingClientRect().top;
          geo=[...ue.querySelectorAll('[data-expk]')].filter(n=>n===ue||n.parentElement===ue||n.hasAttribute('data-expk')).map(n=>{const r=n.getBoundingClientRect(); return {k:+n.getAttribute('data-expk'),top:r.top-t0,h:r.height};});
          if(u.kids.length===1&&u.kids[0]===u.el) geo=[{k:0,top:0,h:ue.getBoundingClientRect().height}]; }});
      geo.sort((p,q)=>p.k-q.k);
      geo.forEach(g=>{
        const sy=Math.max(0,g.top*SC), sh=Math.min(canvas.height-sy,g.h*SC);
        if(sh<=0) return;
        const c=document.createElement('canvas'); c.width=canvas.width; c.height=Math.round(sh);
        c.getContext('2d').drawImage(canvas,0,sy,canvas.width,sh,0,0,canvas.width,sh);
        let w=(canvas.width/SC)*k, hgt=(sh/SC)*k; if(hgt>PH){ const s=PH/hgt; w*=s; hgt=PH; }
        if(!first && ((g.k===0&&u.newPage) || y+hgt>M+PH)){ pdf.addPage(); paintBg(); y=M; }
        pdf.addImage(c.toDataURL('image/jpeg',0.9),'JPEG',M,y,w,hgt,undefined,'FAST');
        y+=hgt+GAP; first=false;
      });
      u.el.removeAttribute('data-expu'); u.kids.forEach(ch=>ch.removeAttribute('data-expk'));
    }
    const blob=pdf.output('blob');
    if(window.__EXPORT_HOOK){ await window.__EXPORT_HOOK(blob, exportName()); }
    else { await DL.save({filename:exportName(), data:blob}); msg.textContent='PDF prêt.'; }
  }catch(e){
    msg.textContent = e&&e.code==='declined'?'Export annulé.':e&&e.code==='rate_limited'?'Un enregistrement est déjà en cours, réessaie dans un instant.':'Export impossible : '+(e&&e.message||'erreur inconnue')+'.';
  }finally{
    root.classList.remove('exporting'); if(prevTheme==null) root.removeAttribute('data-theme'); else root.setAttribute('data-theme',prevTheme);
    ov.remove(); btn.disabled=false;
    show(current); try{ window.scrollTo(sx,sy0); }catch(e){} // redessine la vue proprement
  }
}
$('btnExport').addEventListener('click',exportPDF);
(async()=>{ if(window.__EXPORT_HOOK){ $('btnExport').hidden=false; return; } if(!window.claude?.use) return; const [dl,u]=await Promise.all([claude.use('downloads'),claude.use('user')]); const own=u?await u.isOwner():false; if(dl&&own){ DL=dl; $('btnExport').hidden=false; } })();

/* ===== Démarrage ===== */
renderReport(null); fillSelect();
(async()=>{
  if(!window.claude?.use) return;
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db) return;
  DB=db;
  if(user){ const [own,ed,c]=await Promise.all([user.isOwner(),user.canEdit(),user.can('data.write')]); OWNER=own; if(!(own||ed)||c===false){ canWrite=false; $('btnImport').hidden=true; $('importPanel').hidden=true; } } else { canWrite=false; $('btnImport').hidden=true; }
  let saved=null; try{ saved=localStorage.getItem('match'); }catch(e){}
  db.doc('effectif/saison').onSnapshot(s=>{ const d=s.exists?s.data():null; setRoster(d&&d.joueurs||[]); if(current) show(current); },()=>{});
  db.doc('temps/pro').onSnapshot(s=>{ const d=s.exists?s.data():null; PRO={joueurs:[...((d&&d.joueurs)||[])],minutes:JSON.parse(JSON.stringify((d&&d.minutes)||{}))};
    if(current===MIN_ID && !(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('.mtab'))) renderMinutes(); },()=>{});
  db.doc('temps/saison').onSnapshot(s=>{ const d=s.exists?s.data():null; MIN=JSON.parse(JSON.stringify((d&&d.minutes)||{})); MIN_LOADED=true;
    if(current===MIN_ID && !(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('.mtab'))) renderMinutes();
    if(current===SEASON_ID) renderSeason(); if(current===FICHE_ID&&CMP_OK) renderFiche(); },()=>{});
  db.collection('logos').onSnapshot(snap=>{
    snap.docs.forEach(d=>{const x=d.data(); if(x&&x.dataUrl) LOGOS[d.id]=x.dataUrl;});
    if(current===SEASON_ID) renderSeason(); else if(current===COMPARE_ID) renderCompare(); else if(current===MIN_ID) renderMinutes(); else if(current===FICHE_ID) renderFiche(); else if(window.__report) renderReport(window.__report);
  },()=>{});
  db.collection('matchs').onSnapshot(snap=>{
    MATCHES=snap.docs.map(docToMatch).filter(Boolean).sort((a,b)=>String(b.ajoute).localeCompare(String(a.ajoute))); GINF=inferGroups();
    const okId=id=>(id===SEASON_ID||id===COMPARE_ID||id===MIN_ID||id===FICHE_ID)?MATCHES.length>0:!!MATCHES.find(x=>x.id===id);
    const keep=okId(current)?current:(okId(saved)?saved:([...MATCHES].sort((a,b)=>jnum(b)-jnum(a))[0]?.id||null));
    if(keep===SEASON_ID||keep===COMPARE_ID||keep===MIN_ID||keep===FICHE_ID){ current=keep; fillSelect(); keep===SEASON_ID?renderSeason():keep===COMPARE_ID?renderCompare():keep===FICHE_ID?renderFiche():renderMinutes(); return; }
    const cur=MATCHES.find(x=>x.id===keep);
    if(keep!==current || !document.querySelector('#report main') || (cur&&cur.ajoute!==window.__report?.ajoute)) show(keep); else fillSelect();
  },()=>{});
})();

</script>
